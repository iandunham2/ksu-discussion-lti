name: Keep Render services warm

# Render's free tier spins a service down after ~15 min without traffic, and
# the next request then pays a ~30-60s cold start. During the spin-up window,
# student Save Draft / Post requests on the exam tool failed outright, so we
# ping /health often enough to keep both deployments warm.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping discussion service
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://ksu-discussion-lti.onrender.com/health)
          echo "ksu-discussion-lti -> $code"
          [ "$code" = "200" ]
      - name: Ping exam service
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://ksu-exam-lti.onrender.com/health)
          echo "ksu-exam-lti -> $code"
          [ "$code" = "200" ]
