<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENT 4424 — Demo Launch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 36px; max-width: 560px; width: 100%; }
    h1 { font-size: 1.4rem; color: #1a1a1a; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 0.95rem; margin-bottom: 24px; }
    label { display: block; margin-bottom: 16px; color: #333; font-size: 0.95rem; font-weight: 500; }
    input, select { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; margin-top: 6px; font-family: inherit; }
    input[readonly] { background: #f0f4ff; color: #1a73e8; border-color: #d0d8f0; }
    .hint { font-size: 0.85rem; color: #888; font-weight: 400; margin-top: 4px; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 8px; }
    button:hover { background: #1558b0; }
    .small { font-size: 0.85rem; color: #888; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MENT 4424 Demo Launch</h1>
    <p class="subtitle">Pre-filled for Week 1 discussion. Enter the dev test secret and launch.</p>

    <form method="POST" action="/lti/test-launch">
      <label>
        Role
        <select name="roles">
          <option value="Student" selected>Student</option>
          <option value="Instructor">Instructor</option>
        </select>
      </label>

      <label>
        Full name
        <input type="text" name="lis_person_name_full" value="Demo Student" readonly>
      </label>

      <label>
        Email
        <input type="text" name="lis_person_contact_email_primary" value="demo@students.kennesaw.edu" readonly>
      </label>

      <label>
        User ID
        <input type="text" name="user_id" value="ment4424-demo-student" readonly>
      </label>

      <label>
        Course title
        <input type="text" name="context_title" value="MENT 4424 — Uses and Effects of Mass Media" readonly>
      </label>

      <label>
        Discussion title
        <input type="text" name="resource_link_title" value="Discussion 1: What do mass media do to us, and what do we do with mass media?" readonly>
      </label>

      <input type="hidden" name="context_id" value="ment-4424-fall-2026">
      <input type="hidden" name="resource_link_id" value="ment4424-demo-week1">
      <input type="hidden" name="custom_disc" value="4424-disc0">

      <label>
        Test secret
        <input type="password" name="test_secret" placeholder="Enter LTI_CONSUMER_SECRET from .env" required autocomplete="off">
        <div class="hint">Found in <code>windsurf-project-2/.env</code> as <code>LTI_CONSUMER_SECRET</code>.</div>
      </label>

      <button type="submit">Launch Discussion</button>
    </form>

    <p class="small">This page is for local demo/recording only.</p>
  </div>
</body>
</html>
